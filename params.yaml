# =====================================================================
#  Thermal Digital Twin - TEAM 28-like Levitator (TEMF), axisymmetric
#  ALL "knobs" are here. SI units; geometry entered in mm (code converts to m).
#  Update per teacher's email: Ø16cm plate, 1000/500 coils, WITH iron core, ~5A.
# =====================================================================

units: {length: mm, current: A, frequency: Hz, temperature: degC, power: W}

# --- Electrical excitation (main knob of the twin) ---
# Re-measured on the real rig 2026-06-23 (AC 50Hz, HIKMICRO IR validation session):
# 190V -> 5A is the main operating point (supersedes the earlier 220V estimate).
# 270V -> 7.8A is a second, stronger-heating demo point used to calibrate the coil
# thermal network (see validation_data below). Real-time current sensor: pending.
excitation:
  current_A: 5.0        # MEASURED RMS current (multimeter, rig: 190V -> 5A_rms). NOT a guess.
                        # CONVENTION WARNING: the phasor EM solver expects AMPLITUDE (peak)
                        # = current_A * sqrt(2) = 7.07A for force calculations.
                        # Thermal calibration (hA_inner/outer) was calibrated using current_A
                        # as the amplitude — both P_coil and hA are off by factor 2, so thermal
                        # temperature predictions remain correct. But F_z predictions from the
                        # EM solver are 2x too low: multiply by 2.0 when comparing vs physics.
                        # Set higher (e.g. 20A RMS) only for an exaggerated heating demo.
  voltage_V: 190.0       # MEASURED operating voltage (rig, main op point: 190V -> 5A_rms)
  current_ref_A: 5.0    # reference point (5A_rms = operating condition)
  frequency_Hz: 50.0
  power_ref_W: 9.67     # aluminum plate eddy loss at I_ref=5A_rms (EM solver, corrected
                        # coil radii 2026-07-01, payload OFF). Old value was 2.63W (wrong coil radii).

# --- AC power supply (variac) — identified 2026-07-02 from rig photo (docs/rig_photo.jpg) ---
# Carroll & Meynell "Stelltransformator" CMV 10 E-1: variable autotransformer,
# input 240V 50Hz, feeding the coils THROUGH an ammeter (blue multimeter in the
# photo). CORRECTED 2026-07-10 (was wrong 2026-07-02 -> 2026-07-10): the 0..270
# scale printed on the rotary dial is DEGREES of rotation, NOT output Volts. The
# output voltage instead scales ~linearly with rotation angle up to the input
# voltage at full rotation:
#   V(dial_deg) = (dial_deg / dial_max_deg) * output_V_max
#   e.g. dial=270deg (max) -> V ~= 240V ; dial=220deg -> V ~= 220/270*240 = 195.5V
# This RESOLVES the previously-flagged discrepancy: multimeter measured 190V->5A
# at the coil terminals (2026-06-23) vs the calculated ~195.5V at dial=220deg —
# only a ~5.5V gap, explained by sag under load, not a wrong dial reading.
# Measured dial(deg)->current anchors (2026-07-02, disc levitating) are UNCHANGED
# by this correction (the ammeter readings were never in question, only the
# degree<->Volt interpretation was):
#   dial 0deg   -> 0 A      (off)
#   dial 220deg -> 5.00 A   (main op point, V~=195.5V calculated)
#   dial 270deg -> 7.75-7.85 A (max; anchor uses midpoint 7.78A, V~=240V calculated)
# NOT a constant impedance: Z(dial220)=44Ω vs Z(dial270)=34.7Ω (levitation height
# and coil temperature change the load) → interpolate the table, don't assume I∝V
# across the full range. Below lift-off (dial≲200deg) I∝dial is a fair first guess.
# PURPOSE (user request 2026-07-02): drive the twin's INPUT from the dial/current
# directly — thermal sensors stay validation-only. Phase 1: dial slider in the
# HTML twin mapped through dial_to_current_A. Phase 2: live current sensing
# (non-invasive CT clamp → Arduino → data_io.py), see docs/SENSOR_PLAN.md.
power_supply:
  name: "Carroll & Meynell CMV 10 E-1 (variac, 240V in, 0-270deg dial, 50Hz)"
  type: variac
  input_V: 240.0
  output_V_max: 240.0        # voltage at dial_max_deg (variac tops out near mains input)
  frequency_Hz: 50.0
  dial_unit: degrees          # CORRECTED 2026-07-10: dial scale is rotation angle, not Volts
  dial_min: 0.0
  dial_max: 270.0
  degree_to_volt_ratio: 0.88889   # = output_V_max / dial_max; V(dial) = dial * this ratio
  # measured (dial_deg, I_rms) anchors — extend with more readings next lab session
  dial_to_current_A:
    - {dial: 0.0,   I: 0.0}
    - {dial: 220.0, I: 5.0}
    - {dial: 270.0, I: 7.78}
  interpolation: linear   # piecewise-linear between anchors (monotone)

# --- Aluminum Plate ---
plate_material:
  name: aluminium
  radius_mm: 80.0           # Ø16cm per teacher's email (NOT 13cm)
  thickness_mm: 3.0         # CONFIRMED 3mm (physically measured 2026-07-01)
  z_bottom_mm: 3.8          # initial gap (bottom edge of the plate)
  sigma_S_per_m: 3.4e7      # electrical conductivity at T_ref
  mu_r: 1.0
  k_W_per_mK: 237.0
  rho_kg_per_m3: 2700.0
  cp_J_per_kgK: 900.0
  sigma_tempco_per_K: 3.9e-3   # α: σ(T)=σ0/(1+α(T-T0)); enabled in Phase 3

# --- Copper coils — geometry RE-MEASURED 2026-07-10 (direct ruler measurement of
# the physical rig, superseding the 2026-07-01 "physical layout description" pass).
# Actual rig cross-section (r in mm):
#   0..25.9    center core (IRON — magnet-attracted, see iron_core below)
#   25.9..27.9 air gap 2mm
#   27.9..61.9 inner coil 1000 turns, 34mm wide  <-- WAS WRONG (2026-07-01: 28..78, 50mm)
#              (cross-check: measured OD 121mm -> r_outer=60.5mm, ~1.4mm from the
#              34mm-wide chain value above -- within ruler-measurement tolerance,
#              chain value used since it's the directly-stepped measurement)
#   61.9..64.9 air gap 3mm
#   64.9..79.9 iron ring, 15mm wide  <-- WAS WRONG (2026-07-01: 81..101, 20mm wide)
#   79.9..82.9 air gap 3mm
#   82.9..102.9 outer coil 500 turns, 20mm wide  <-- WAS WRONG (2026-07-01: 104..124)
#   102.9..~130.4 air ~25-30mm -> near (inner) wall of octagonal wood frame
#   ~130.4..~180.4 further ~50mm total (from outer coil) to the frame's OUTER edge
# Note: levitating Al disc R=80mm sits ABOVE this assembly; its edge (80mm) now
#       overlaps the iron-ring region (64.9..79.9mm), NOT just the inner coil
#       (unlike the pre-2026-07-10 geometry where the disc edge sat just inside
#       the inner coil's own outer edge at 78mm) -- re-run EM before trusting
#       any disc-vs-field-region reasoning written before this update.
coils:
  height_mm: 53.0            # measured 2026-07-10: avg height of the concentric rings
  z_top_mm: 0.0
  z_bottom_mm: -53.0
  wire_diameter_mm: 1.2
  sigma_Cu_S_per_m: 5.96e7
  fill_factor: 0.6      # placeholder: real winding has insulation between turns,
                        # so copper doesn't fill 100% of the wound cross-section.
                        # NOT yet wired into the EM/ohmic-loss formulas below.
  inner:                    # INNER coil = 1000 turns — geometry RE-MEASURED 2026-07-10
    turns: 1000
    r_inner_mm: 27.9
    r_outer_mm: 61.9         # RE-MEASURED (was 78.0 — old model was 50mm wide, actual is 34mm)
    current_sign: +1
  outer:                    # OUTER coil = 500 turns — geometry RE-MEASURED 2026-07-10
    turns: 500
    r_inner_mm: 82.9         # RE-MEASURED (was 104.0)
    r_outer_mm: 102.9        # RE-MEASURED (was 124.0, width unchanged at 20mm)
    current_sign: -1        # opposite winding direction -> reverse current

# --- Center core — MATERIAL FLIPPED 2026-07-10: IS ferromagnetic (magnet-attracted).
# SUPERSEDES the 2026-07-01 "CONFIRMED NON-FERROMAGNETIC" entry (unpowered magnet
# test at the time read no attraction; user re-tested 2026-07-10 and confirmed it
# DOES attract a magnet -- the earlier negative result is now considered wrong,
# e.g. a coating/paint layer or a miss on the core vs. an adjacent non-magnetic
# part). mu_r=1000/sigma=1e6 restored to the pre-2026-07-01 placeholder values
# (docs/physics.md "e.g. mu_r=1000"; real material unconfirmed beyond "iron" --
# treat as mild-steel-like until a B-H curve or resistivity measurement exists).
# Radius updated from the new diameter measurement (51.8mm -> r=25.9mm, was 25.0mm).
iron_core:
  enabled: true
  mu_r: 1000.0               # RESTORED 2026-07-10: confirmed ferromagnetic (magnet test positive)
  sigma_S_per_m: 1.0e6       # solid iron -> eddy loss present (P_iron no longer 0W)
  r_inner_mm: 0.0           # central cylindrical core
  r_outer_mm: 25.9           # RE-MEASURED 2026-07-10 (was 25.0mm; diameter 51.8mm/2)
  z_top_mm: 0.0
  z_bottom_mm: -53.0
  B_sat_T: 1.5              # mu_r>>1 now -- saturation check matters again, re-verify B_max

# --- Iron ring between inner coil and outer coil — MATERIAL CONFIRMED 2026-07-10 ---
# Physical position RE-MEASURED 2026-07-10: r = 64.9..79.9mm (15mm wide, was
# 81..101mm/20mm wide), same height as coils (53mm). Sits in the 21mm gap between
# the (also re-measured) inner coil outer edge (61.9mm) and outer coil inner edge
# (82.9mm). Called "một lớp sắt"/"lõi sắt thứ 2" (iron layer / 2nd iron core) by
# user -- material CONFIRMED IRON 2026-07-10 (magnet-attracted, same test as the
# center core above), superseding the previous "PENDING colleague confirmation"
# status. mu_r=1000/sigma=1e6 mild-steel-like placeholder (see iron_core comment;
# same "real material unconfirmed beyond ferromagnetic" caveat applies).
outer_iron_ring:
  enabled: true
  mu_r: 1000.0               # CONFIRMED 2026-07-10: ferromagnetic (magnet test positive)
  sigma_S_per_m: 1.0e6       # solid iron -> eddy loss present
  r_inner_mm: 64.9            # RE-MEASURED 2026-07-10 (was 81.0)
  r_outer_mm: 79.9            # RE-MEASURED 2026-07-10 (was 101.0, width 20mm->15mm)
  z_top_mm: 0.0
  z_bottom_mm: -53.0
  B_sat_T: 1.5              # mu_r>>1 now -- saturation check matters, re-verify B_max
  material_note: "CONFIRMED 2026-07-10: ferromagnetic (magnet-attracted), same as iron_core. Exact alloy/B-H curve still unconfirmed -- mild-steel-like mu_r=1000 placeholder."

# --- Octagonal plywood housing (visual only, used by build_twin_html_fem.py) ---
# RE-MEASURED 2026-07-10: outer coil (now r=102.9mm) to the frame's NEAR (inner)
# wall is 25-30mm air (midpoint 27.5mm used below); total outer coil -> frame's
# OUTER edge is 50mm, implying wall_thickness_mm=50-27.5=22.5mm (was air_gap=50,
# wall=20 under the old, larger outer-coil-radius geometry).
device_frame:
  air_gap_mm: 27.5          # air between outer coil r_outer and frame inner wall -> r_in = 130.4mm
  wall_thickness_mm: 22.5   # plywood wall thickness -> frame r = 130.4..152.9mm

# --- Payload Model ---
# PLACEHOLDER, disabled by default. When enabled, EM adds P_payload_W and the
# thermal solver stacks the disc on top of the plate (see thermal_solver/rom which
# now account P_payload_W). Confirm real payload geometry before trusting results.
payload_model:
  enabled: false
  name: steel_disc_placeholder
  radius_mm: 40.0        # A disc with radius smaller than the aluminum plate
  thickness_mm: 5.0      # 5mm thick
  k_W_per_mK: 50.0       # Thermal conductivity (e.g., carbon steel)
  sigma_S_per_m: 6.0e6   # Electrical conductivity (for computing eddy currents on payload)
  mu_r: 100.0            # Magnetic permeability (if magnetic material)
  rho_kg_per_m3: 7850.0  # carbon steel density (for thermal capacity in the demo)
  cp_J_per_kgK: 490.0    # carbon steel specific heat

# --- Thermal boundary conditions ---
# h_bottom > h_top because hot air from coils below enhances convection
thermal_bc:
  T_ambient_degC: 20.0   # Professor (Juni 2026): "nehmt einfach 20°C an".
                          # Upgrade to real lab sensor data later if results are inaccurate.
  h_convection_W_per_m2K: 10.0    # top + side surfaces (natural convection)
  h_bottom_W_per_m2K: 25.0        # bottom surface facing coils (enhanced convection)
  emissivity: 0.0
  # Coil→disc air coupling: Tinf_bot = T_amb + k_coil * P_coil_W.
  # Physical estimate: 3.8mm gap, conduction+radiation → k_coil ≈ 0.10–0.30 K/W.
  # RE-CALIBRATED 2026-07-02: this constant's own "ΔT≈11-13K at 5A" design intent
  # was set against the OLD P_coil≈73W. The 2026-07-01 coil-radii fix bumped
  # P_coil(5A) to 128.17W, but k was never revisited -- with the old k=0.15 this
  # silently became Tinf_bot=39.2C (ΔT=19.2K), i.e. the disc's bottom-air BC ended
  # up hotter than the design intent. Combined with the disc's OWN (also
  # unvalidated) eddy-convection rise (~13.5K, see h_* above), the FEM's disc
  # T_mean(5A)=46.9C ended up ABOVE the IR-calibrated inner coil T_ss(5A)=40.3C --
  # physically backwards (coils are the heat source; IR sessions show coils as
  # the hottest part of the device by a wide margin, see CLAUDE.md). Rescaled k
  # so Tinf_bot again lands mid-way in the documented 11-13K range at the NEW
  # P_coil: k=12K/128.17W≈0.094. Disc T_mean(5A) drops to ≈41.9C, now close to
  # (not below by a wide margin) T_inner_ss(5A)=40.3C -- the remaining gap is
  # bounded by the disc's OWN guessed h_top/h_bottom, which still need real
  # thermocouple data to calibrate (see CLAUDE.md/SENSOR_PLAN.md NEXT item).
  k_coil_coupling_K_per_W: 0.094

# --- Levitating disc RENDER geometry (visual only; physics uses plate_material) ---
# ONE flat solid disc whose radius is taken from plate_material.radius_mm above.
# Physics (eddy loss + thermal mass) stays at Ø160mm x 3mm; only the 3D display
# height is exaggerated so the thin disc reads as a solid object.
levitating_disc:
  n_theta: 120                 # revolve resolution (rim smoothness)
  display_z_exaggeration: 2.0  # VISUAL ONLY: 3mm plate → 6mm display height
  # VISUAL exaggeration of the through-thickness gradient. The hot air rising from
  # the coils heats the disc's BOTTOM face; eddy currents heat it uniformly. The
  # real Δz across a 3mm Al plate is ~0.03 K (invisible), so the hot-air component
  # is weighted bottom>top by g(f)=1+grad·(0.5−f), f=0 bottom→1 top. grad=0 disables
  # it; 0.5 ⇒ bottom runs ~1.7× the top of the hot-air rise. Thickness-mean is
  # preserved, so T_mean and the validated steady state are unchanged.
  bottom_heating_gradient: 0.5
  plate_hot_display_C: 125.0  # display-only: JS heat-color ramp ceiling for the disc, not physics

# --- Metal plate library (swap for comparison) ---
# REPLACED 2026-07-10 with the team's real measured disc set (solid aluminium,
# 3mm thick, radius/mass measured on the actual discs) -- the previous Ø100/
# Ø200/Ø202mm (r=50/100/101mm) and Cu Ø160mm entries were not real stocked
# discs and were dropped (--plate-radius still accepts any override at build
# time, e.g. `python build_twin_html_fem.py --plate-radius 101`, this just
# removed those radii from the default plate_library/disc-compare-mode list).
# mass_g is the measured weight (reference/QA only, no code reads it yet) --
# idealized rho*V mass (Al 2700 kg/m3, t=3mm) is within ~3% of mass_g for all
# four, consistent with real machining/measurement tolerance.
# Ø160mm ("Al Ø160mm", r=80mm) is the STANDARD disc used for rig tests --
# matches plate_material's default radius_mm=80 above.
# Ø = diameter (2×radius_mm), radius_mm = radius (the field the solver actually uses).
plate_library:
  - {name: "Al Ø130mm", radius_mm: 65.0, thickness_mm: 3.0, material: aluminium, mass_g: 113}
  - {name: "Al Ø140mm", radius_mm: 70.0, thickness_mm: 3.0, material: aluminium, mass_g: 126}
  - {name: "Al Ø150mm", radius_mm: 75.0, thickness_mm: 3.0, material: aluminium, mass_g: 142}
  - {name: "Al Ø160mm", radius_mm: 80.0, thickness_mm: 3.0, material: aluminium, mass_g: 159}  # STANDARD test disc

# --- Hollow/annular aluminium discs (measured 2026-07-10) --- NOT YET SIMULATED.
# Real physical discs the team also has ("Al Ø110/55mm": outer r=55mm/Ø110mm,
# bored-out inner hole r=27.5mm/Ø55mm, 3 stock thicknesses). Deliberately kept
# OUT of plate_library above: thermal_solver.py/em_solver.py mesh SOLID discs
# from r=0 only -- there is no inner-radius/hole geometry support in the FEM
# mesh generation yet, and every plate_library consumer (digital_twin.py's
# RadioButtons, sim_plates.py, build_twin_html_fem.py's disc-compare mode)
# treats radius_mm as a solid disc, so mixing these in would silently compute
# WRONG physics (treating the bored-out hole as solid metal). Data recorded
# here for whoever adds annulus support later. mass_g is the measured weight;
# idealized rho*V annulus mass (Al 2700 kg/m3) runs ~10-18% BELOW mass_g for
# all three (unlike the solid discs above, which match to ~3%) -- unexplained,
# possibly a denser alloy or extra rim geometry not captured by outer/inner
# radius alone. Flag for whoever implements the hole geometry, not blocking.
plate_library_annulus_TODO:
  - {name: "Al Ø110/55mm t3.5", outer_radius_mm: 55.0, inner_radius_mm: 27.5, thickness_mm: 3.5, material: aluminium, mass_g: 79}
  - {name: "Al Ø110/55mm t2.8", outer_radius_mm: 55.0, inner_radius_mm: 27.5, thickness_mm: 2.8, material: aluminium, mass_g: 60}
  - {name: "Al Ø110/55mm t1.8", outer_radius_mm: 55.0, inner_radius_mm: 27.5, thickness_mm: 1.8, material: aluminium, mass_g: 41}

# --- Levitation gap spring-mass-damper (WP-A/WP-D, docs/PLAN_SIM_FEEDBACK_2026-07-02.md) ---
# JS reads these via PARAMS.lev (build_twin_html_fem.py lev_params()/romStep)
# instead of hardcoding them. z_gap_5A_mm/z_decay_mm below are the DEFAULT
# R=80mm (the physically-validated disc) anchors ONLY -- any OTHER plate radius
# (e.g. --plate-radius 101) gets its OWN anchors recomputed via _lev_anchor()
# instead of silently reusing these (fixes the WP-C-flagged bug where the R=101
# build showed a nonzero gap at 5A even though that disc doesn't lift until
# ~6.45A). See lev_params() in build_twin_html_fem.py for the radius selection.
levitation:
  # UPDATED 2026-07-10: both values below RECOMPUTED after the coil-radii remeasurement
  # + center-core/iron-ring material flip to confirmed iron (mu_r=1000, see coils:/
  # iron_core:/outer_iron_ring: above) -- superseding the 2026-07-01/WP-Z0 values (was
  # z_gap_5A_mm=4.1, z_decay_mm=13.6). ⚠️ OPEN QUESTION (see CLAUDE.md "LIFT FORCE"):
  # the new z_gap_5A_mm=11.7mm predicts a ~14.7mm VISIBLE gap, but the real observed
  # visible gap is 7-8mm (2026-07-01) -- do NOT treat this as re-validated, it's the
  # direct output of the current (possibly-too-high) mu_r=1000 placeholder, kept as-is
  # per user request rather than reverse-fit back to the old observation.
  z_gap_5A_mm: 11.7    # [mm] equilibrium gap at I=5A_rms, R=80mm, from run_rig_validation()'s
                        # full F(z) vs F_grav sweep (crossing between z=10mm/12mm)
  z_decay_mm: 11.79    # [mm] EM force decay length z0, R=80mm, same F(1mm)/F(5mm) method as
                        # WP-Z0 below (z0=(5-1)/ln(F(1mm)/F(5mm)), F(1mm)=4.58N, F(5mm)=3.26N)
  # --- Pre-2026-07-10 history (WP-Z0, docs/AUDIT_FIX_PLAN_2026-07-04.md OQ-4): two
  # fitting methods disagreed for the SAME disc under the OLD (non-iron) geometry --
  # 21.4mm (F(1mm)/F_grav crossing) vs 13.6mm (F(1mm)/F(5mm) refit, used for every OTHER
  # plate radius via _lev_anchor() in build_twin_html_fem.py). User confirmed the real
  # rig's gap only "nudges up a little" at 7.75A, matching the smaller 13.6mm value --
  # switched to 13.6mm so R=80 used the SAME method as every other radius. See
  # docs/CHANGELOG.md "WP-D". Both numbers are superseded by the 2026-07-10 iron update
  # above; kept here for context on how the F1/F5 method itself was chosen.
  zeta0: 0.0            # damping ratio floor
  zeta1: 0.02           # damping ratio grows with (I/5A)^2; zeta(5A)=0.02 matches the
                        # observed ~9s settle time (2026-07-01). zeta(7.75A) only
                        # reaches ~0.048 under this law -- the WP-A overshoot
                        # acceptance target implies ~0.3 is needed; OPEN QUESTION.
  jit_mm: 0.3           # [display-mm] max sub-liftoff shimmer amplitude
  jit_freq1_rad_s: 27.0 # visual-only shimmer rates (incommensurate, NOT the physical 100Hz)
  jit_freq2_rad_s: 71.0
  jit_fade_mm: 0.5      # display-only: jitter amplitude fades out once levitation gap exceeds this, in mm
  z_gap_exaggeration: 2.0  # display exaggeration, matches levitating_disc.display_z_exaggeration

