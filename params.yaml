# =====================================================================
#  Thermal Digital Twin - TEAM 28-like Levitator (TEMF), axisymmetric
#  ALL "knobs" are here. SI units; geometry entered in mm (code converts to m).
#  Update per teacher's email: Ø16cm plate, 1000/500 coils, WITH iron core, ~5A.
# =====================================================================

units: {length: mm, current: A, frequency: Hz, temperature: degC, power: W}

# --- Electrical excitation (main knob of the twin) ---
# Re-measured on the real rig 2026-06-23 (AC 50Hz, HIKMICRO IR validation session):
# 190V -> 5A is the main operating point (supersedes the earlier 220V estimate).
# 270V -> 7.8A is a second, stronger-heating demo point used to calibrate the coil
# thermal network (see validation_data below). Real-time current sensor: pending.
excitation:
  current_A: 5.0        # MEASURED RMS current (multimeter, rig: 190V -> 5A_rms). NOT a guess.
                        # CONVENTION WARNING: the phasor EM solver expects AMPLITUDE (peak)
                        # = current_A * sqrt(2) = 7.07A for force calculations.
                        # Thermal calibration (hA_inner/outer) was calibrated using current_A
                        # as the amplitude — both P_coil and hA are off by factor 2, so thermal
                        # temperature predictions remain correct. But F_z predictions from the
                        # EM solver are 2x too low: multiply by 2.0 when comparing vs physics.
                        # Set higher (e.g. 20A RMS) only for an exaggerated heating demo.
  voltage_V: 190.0       # MEASURED operating voltage (rig, main op point: 190V -> 5A_rms)
  current_ref_A: 5.0    # reference point (5A_rms = operating condition)
  frequency_Hz: 50.0
  power_ref_W: 9.67     # aluminum plate eddy loss at I_ref=5A_rms (EM solver, corrected
                        # coil radii 2026-07-01, payload OFF). Old value was 2.63W (wrong coil radii).

# --- Aluminum Plate ---
plate_material:
  name: aluminium
  radius_mm: 80.0           # Ø16cm per teacher's email (NOT 13cm)
  thickness_mm: 3.0         # CONFIRMED 3mm (physically measured 2026-07-01)
  z_bottom_mm: 3.8          # initial gap (bottom edge of the plate)
  sigma_S_per_m: 3.4e7      # electrical conductivity at T_ref
  mu_r: 1.0
  k_W_per_mK: 237.0
  rho_kg_per_m3: 2700.0
  cp_J_per_kgK: 900.0
  sigma_tempco_per_K: 3.9e-3   # α: σ(T)=σ0/(1+α(T-T0)); enabled in Phase 3

# --- Copper coils — radii CORRECTED 2026-07-01 from physical layout description ---
# Actual rig cross-section (r in mm):
#   0..25  center core (non-ferromagnetic)
#   25..28 air gap ~2-3mm
#   28..78 inner coil 1000 turns  <-- WAS WRONG (old: 28..43)
#   78..81 air gap ~3mm
#   81..101 iron/separator ring   (magnet-test PENDING for this ring)
#   101..104 air gap ~2mm
#   104..124 outer coil 500 turns <-- WAS WRONG (old: 46.5..61.5)
#   124..174 air (~50mm) -> structural plate edge of device frame
# Note: levitating Al disc R=80mm sits ABOVE this assembly;
#       its edge (80mm) is just inside the inner coil outer edge (78mm).
coils:
  height_mm: 52.0
  z_top_mm: 0.0
  z_bottom_mm: -52.0
  wire_diameter_mm: 1.2
  sigma_Cu_S_per_m: 5.96e7
  fill_factor: 0.6      # placeholder: real winding has insulation between turns,
                        # so copper doesn't fill 100% of the wound cross-section.
                        # NOT yet wired into the EM/ohmic-loss formulas below.
  inner:                    # INNER coil = 1000 turns — CONFIRMED CORRECTED 2026-07-01
    turns: 1000
    r_inner_mm: 28.0
    r_outer_mm: 78.0         # CORRECTED (was 43.0 — old model was 15mm wide, actual is 50mm)
    current_sign: +1
  outer:                    # OUTER coil = 500 turns — CONFIRMED CORRECTED 2026-07-01
    turns: 500
    r_inner_mm: 104.0        # CORRECTED (was 46.5)
    r_outer_mm: 124.0        # CORRECTED (was 61.5)
    current_sign: -1        # opposite winding direction -> reverse current

# --- Center core (previously called "iron core") — CONFIRMED 2026-07-01 ---
# Physical magnet-contact test (unpowered): NO attraction to a permanent magnet.
# CONFIRMED NON-FERROMAGNETIC. mu_r = 1.0 (same as air, no flux concentration).
# Also confirmed non-thermally-conductive (ceramic-like or aluminium-oxide Al2O3).
# Electrically non-conductive -> sigma = 0, P_iron = 0 W (no eddy loss in core).
# Electromagnetically this region is identical to air; kept enabled=true to preserve
# geometry region for 3D visualization (build_twin_html_fem.py region 3).
# Geometry (r_outer_mm etc.) unchanged -- confirm with ruler when next on the rig.
iron_core:
  enabled: true
  mu_r: 1.0                 # CONFIRMED: non-ferromagnetic (magnet test negative 2026-07-01)
  sigma_S_per_m: 0.0        # non-conductive (ceramic/oxide) -> no eddy loss in core
  r_inner_mm: 0.0           # central cylindrical core
  r_outer_mm: 25.0
  z_top_mm: 0.0
  z_bottom_mm: -52.0
  B_sat_T: 1.5              # unused now (mu_r=1, no saturation); kept for reference

# --- Iron/separator ring between inner coil and outer coil — CORRECTED 2026-07-01 ---
# Physical position confirmed: r = 81..101mm (20mm wide), same height as coils (52mm).
# Sits in the 23mm gap between inner coil outer edge (78mm) and outer coil inner edge (104mm).
# Called "một lớp sắt" (iron layer) by user. Material properties PENDING colleague confirmation.
# Center core (r=0..25mm) tested NON-ferromagnetic; this outer ring NOT YET tested.
#
# MATERIAL STATUS (2026-07-01):
#   - Magnet-contact test: NOT YET DONE on this ring
#   - Colleague will provide material data (mu_r, sigma, or material name) — update then.
#   - Conservative assumption until confirmed: mu_r=1.0 (air-like), sigma=0.0 (non-conductive)
#   - If ferromagnetic (e.g. mild steel): mu_r ≈ 100..1000, sigma ≈ 1e6 S/m → re-run EM
#   - If non-ferromagnetic stainless / Al alloy: mu_r ≈ 1.0, sigma ≈ 1e6..1e7 S/m → eddy loss
#   - If ceramic / plastic: mu_r=1.0, sigma=0.0 (same as current air model)
#
# EM effect: this region currently modeled as AIR in em_solver.material().
# Geometry wired into EM solve via outer_iron_ring section below.
outer_iron_ring:
  enabled: true
  mu_r: 1.0                 # PENDING colleague confirmation — conservative placeholder (air-like)
  sigma_S_per_m: 0.0        # conservative: no eddy loss until material confirmed
  r_inner_mm: 81.0
  r_outer_mm: 101.0
  z_top_mm: 0.0
  z_bottom_mm: -52.0
  B_sat_T: 1.5              # only relevant if mu_r >> 1; kept for future use
  material_note: "PENDING — colleague will provide material properties (ask for: ferromagnetic Y/N, material name, sigma if known)"

# --- Octagonal plywood housing (visual only, used by build_twin_html_fem.py) ---
# Real device: outer coil (r=124mm) stands FREE with ~50mm of air before the
# octagonal plywood frame walls (user-verified vs docs/real_model.png, 2026-07-01).
device_frame:
  air_gap_mm: 50.0          # air between outer coil r_outer and frame inner wall -> r_in = 174mm
  wall_thickness_mm: 20.0   # plywood wall thickness -> frame r = 174..194mm

separator_ring:
  material: pending_colleague_confirmation
  sigma_S_per_m: 0.0        # conservative until confirmed
  mu_r: 1.0                 # conservative until confirmed; see outer_iron_ring above

# --- Payload Model ---
# PLACEHOLDER, disabled by default. When enabled, EM adds P_payload_W and the
# thermal solver stacks the disc on top of the plate (see thermal_solver/rom which
# now account P_payload_W). Confirm real payload geometry before trusting results.
payload_model:
  enabled: false
  name: steel_disc_placeholder
  radius_mm: 40.0        # A disc with radius smaller than the aluminum plate
  thickness_mm: 5.0      # 5mm thick
  k_W_per_mK: 50.0       # Thermal conductivity (e.g., carbon steel)
  sigma_S_per_m: 6.0e6   # Electrical conductivity (for computing eddy currents on payload)
  mu_r: 100.0            # Magnetic permeability (if magnetic material)
  rho_kg_per_m3: 7850.0  # carbon steel density (for thermal capacity in the demo)
  cp_J_per_kgK: 490.0    # carbon steel specific heat

# --- Thermal boundary conditions ---
# h_bottom > h_top because hot air from coils below enhances convection
thermal_bc:
  T_ambient_degC: 20.0   # Professor (Juni 2026): "nehmt einfach 20°C an".
                          # Upgrade to real lab sensor data later if results are inaccurate.
  h_convection_W_per_m2K: 10.0    # top + side surfaces (natural convection)
  h_bottom_W_per_m2K: 25.0        # bottom surface facing coils (enhanced convection)
  emissivity: 0.0
  # Coil→disc air coupling: Tinf_bot = T_amb + k_coil * P_coil_W.
  # Physical estimate: 3.8mm gap, conduction+radiation → k_coil ≈ 0.10–0.30 K/W.
  # At 5A (P_coil≈73W): k=0.15 → Tinf_bot≈31°C → disc T_ss≈31–33°C (ΔT≈11–13K).
  # Calibrate from thermocouple measurement once sensor data is available.
  k_coil_coupling_K_per_W: 0.15

# --- Levitating disc RENDER geometry (visual only; physics uses plate_material) ---
# ONE flat solid disc whose radius is taken from plate_material.radius_mm above.
# Physics (eddy loss + thermal mass) stays at Ø160mm x 3mm; only the 3D display
# height is exaggerated so the thin disc reads as a solid object.
levitating_disc:
  n_theta: 120                 # revolve resolution (rim smoothness)
  display_z_exaggeration: 2.0  # VISUAL ONLY: 3mm plate → 6mm display height
  # VISUAL exaggeration of the through-thickness gradient. The hot air rising from
  # the coils heats the disc's BOTTOM face; eddy currents heat it uniformly. The
  # real Δz across a 3mm Al plate is ~0.03 K (invisible), so the hot-air component
  # is weighted bottom>top by g(f)=1+grad·(0.5−f), f=0 bottom→1 top. grad=0 disables
  # it; 0.5 ⇒ bottom runs ~1.7× the top of the hot-air rise. Thickness-mean is
  # preserved, so T_mean and the validated steady state are unchanged.
  bottom_heating_gradient: 0.5

# --- Metal plate library (swap for comparison) ---
plate_library:
  - {name: "Al Ø50mm",  radius_mm:  50.0, thickness_mm: 3.0, material: aluminium}
  - {name: "Al Ø65mm",  radius_mm:  65.0, thickness_mm: 3.0, material: aluminium}
  - {name: "Al Ø80mm",  radius_mm:  80.0, thickness_mm: 3.0, material: aluminium}
  - {name: "Al Ø100mm", radius_mm: 100.0, thickness_mm: 3.0, material: aluminium}
  - {name: "Cu Ø80mm",  radius_mm:  80.0, thickness_mm: 3.0, material: copper}

# --- Material properties (lookup by name in plate_library) ---
material_props:
  aluminium:
    k_W_per_mK: 237.0
    rho_kg_per_m3: 2700.0
    cp_J_per_kgK: 900.0
    sigma_S_per_m: 3.4e7
    mu_r: 1.0
    sigma_tempco_per_K: 3.9e-3
  copper:
    k_W_per_mK: 400.0
    rho_kg_per_m3: 8960.0
    cp_J_per_kgK: 385.0
    sigma_S_per_m: 5.96e7
    mu_r: 1.0
    sigma_tempco_per_K: 3.9e-3

# --- Thermal mesh (plate only) ---
mesh: {nr: 40, nz: 16}

# --- EM domain & mesh (mm). Professor (Juni 2026): 1×1m box should be enough.
# Validate: compare Dirichlet vs Neumann BC — if results match, domain is large enough.
# If edge effects appear, increase further.
em_domain:
  r_max_mm: 1000.0          # 2m box (enlarged from 1m to pass boundary condition validation)
  z_min_mm: -1000.0
  z_max_mm: 1000.0
  fine_step_mm: 2.0         # fine step around device
  coarse_step_mm: 20.0      # coarse step in far air region

# --- Transient (Phase 2) ---
transient: {dt_s: 1.0, t_end_s: 600.0}

# --- Original benchmark (to validate EM solver; NO iron core, 20A) ---
# Geometry from the actual TeamProblem28.pdf (Karl/Fetzer/Kurz/Lehner/Rucker, Fig.2 +
# text), supplied by the user 2026-06-23 -- NOT the same coil geometry as this rig
# (rig's 1000/500-turn coils are a different, separately-measured device; user
# confirmed "ap dung so do len model thuc" -- don't reconcile the two).
# Fig.2 dims (mm): plate dia 130 (R=65) x 3 thick; coil block height 52; w1 (inner,
# 960t) r=15..28; w2 (outer,576t) r=41..46.5; current i(t)=20A*sin(2*pi*50*t), coils
# in series with OPPOSITE winding sense (matches current_sign convention already
# used for the rig); initial rest gap z=3.8mm (matches plate_material.z_bottom_mm
# default); settles at z=11.3mm after damped oscillation.
# STATUS (2026-06-23): with this geometry (was previously missing -- benchmark used
# to silently fall back to the RIG's coil radii, very wrong), z_eq~=7.1mm vs 11.3mm
# expected (37% error) -- much closer than the old z_eq~=3.4mm (70% error), but not
# matching yet. Ruled out: mesh resolution (converges by fine_step=0.2mm, run_bench
# mark_validation() now uses that just for this benchmark), domain size/coarse_step
# (no sensitivity), current_sign convention (flipping it overshoots by 20-30x, so
# opposite-winding is right). Remaining gap is unexplained -- some other modelling
# detail differs from the paper's BEM-FEM method. See CLAUDE.md.
benchmark_team28_original:
  current_A: 20.0
  inner_turns: 960
  outer_turns: 576
  inner_r_inner_mm: 15.0
  inner_r_outer_mm: 28.0
  outer_r_inner_mm: 41.0
  outer_r_outer_mm: 46.5
  plate_radius_mm: 65.0
  initial_gap_mm: 3.8       # informational: rest position at t<=0 (winding-form thickness)
  expected_levitation_height_mm: 11.3

# --- Real-rig validation data (HIKMICRO IR camera session, 2026-06-23) ---
# Two measured operating points (AC 50Hz). thermal_at_7p8A is the calibration
# anchor for the coil lumped thermal network (see lumped_thermal below) --
# coil readings (dark varnish) are trustworthy; disc/center readings are NOT
# (shiny aluminium, true emissivity ~0.1 vs camera epsilon=0.91 -> reads low).
validation_data:
  source: "AC 50Hz"
  op_points:
    - {V: 190, I: 5.0}
    - {V: 270, I: 7.8}
  thermal_at_7p8A:
    inner_coil_C: 79
    outer_coil_C: 74
    center_core_C: 45
    separator_C: 40
    disc_rim_C: 40
    disc_center_C: 37
    ambient_C: 29
    note: "disc+center IR unreliable (shiny Al, ε set 0.91)"
  # Second session, same day: a two-stage current RAMP (not held at one current
  # long enough to reach steady state) -- used to fit the coil's TRANSIENT time
  # constant (tau), since thermal_at_7p8A above only constrains the steady state.
  # Timestamps are from the narrated timeline (approximate, +-~10s), t=0 at the
  # start of the 0->5A ramp. ambient ranged 28.6-33.7C across the rig (not a single
  # clean value); coil/disc-bottom readings used here, not the unreliable shiny-Al
  # disc/center ones (see note above -- same caveat likely applies to this run's
  # disc+center readings too, not explicitly re-tested with matte paint).
  thermal_ramp_test:
    stage1: {t_s: [0, 300], I_A: 5.0, V: 190}
    stage2: {t_s: [300, 450], I_A: 7.75, V: 270}
    outer_coil_C_vs_t: [{t_s: 140, C: 40}, {t_s: 200, C: 43}, {t_s: 300, C: 48.5},
                         {t_s: 360, C: 55.75}, {t_s: 450, C: 56}]
    at_t450s:
      inner_coil_C: 60.75
      outer_coil_C: 56
      center_core_C: 39.5      # unreliable, see note above
      separator_C: 36
      disc_bottom_rim_C: 44
      disc_bottom_center_C: 35  # unreliable, see note above
    note: "ambient 28.6-33.7C across the rig; used T_amb=29C to match thermal_at_7p8A"

# --- Lumped thermal network: coils/iron -> shared local air node -> far ambient.
# hA_inner/hA_outer RE-CALIBRATED 2026-07-01 after correcting coil geometry.
# Previous calibration (2026-06-23) used WRONG coil radii (inner 28-43mm, outer
# 46.5-61.5mm) -> P_coil(5A)=72.8W. Corrected radii (inner 28-78mm, outer
# 104-124mm) give P_coil(5A)=128.2W (P_inner=61.75W, P_outer=66.41W).
# Same source data: validation_data.thermal_at_7p8A (steady state: inner=79C,
# outer=74C, T_amb=29C) AND validation_data.thermal_ramp_test (transient).
# Steady-state equations (7.8A as amplitude, same convention as before):
#   T_inner = T_amb + P_inner(7.8A)/hA_inner + AIR_DT_SS
#   T_outer = T_amb + P_outer(7.8A)/hA_outer + AIR_DT_SS
#   AIR_DT_SS = P_total(7.8A) / air_node_hA_far = 311.9/40 = 7.80 K
#   -> hA_inner = 150.3/(79-29-7.8) = 3.5611 W/K
#   -> hA_outer = 161.6/(74-29-7.8) = 4.3446 W/K
# Predicted steady state at 5A/T_amb=20C: T_inner=40.5C, T_outer=38.5C (same as
# before -- makes sense: both P and hA scaled proportionally, so T_ss is invariant).
# coil_C_scale refit via weighted least-squares from ramp-test transient (see
# validation_data.thermal_ramp_test): optimized scale=0.2241 (was 0.434 with old
# wrong narrow coils; old C_solid was ~1513 J/K, new correct C_solid=5556 J/K;
# effective C_eff = 0.2241*5556 = 1245 J/K -- physically larger than old 657 J/K,
# as expected for the correct bigger coil). Transient unweighted RMS residual ~3C
# (similar quality to old fit). Treat tau as order-of-magnitude (fit from narrated
# timeline +-~10s uncertainty; a logged repeat run would sharpen it).
# air_node_hA_far_W_per_K kept at 40.0 (not enough independent data to refit).
# Iron/core node (2026-07-02): heated by CONTACT CONDUCTION from the inner coil
# (G_iron_cond), not just via the air pocket -- without it the node stayed ~2K
# above ambient after 30 min while the real core/separator reach 36-45C.
# Anchored on HIKMICRO session 1 (7.8A steady, amb 29C): core 45C (+16K) while
# inner coil +50K -> steady ratio ~0.32; time constant ~4 min. Solving
# tau = C/(G+hA) = 240s with the 0.32 ratio (C = 73 J/K) gives G=0.06, hA=0.244.
# CAVEAT: core IR reading is low-confidence (shiny surface, wrong emissivity) --
# order-of-magnitude fit; refit with contact thermocouples later.
lumped_thermal:
  hA_inner_W_per_K: 3.5611    # refit 2026-07-01 with corrected coil radii (was 2.2479)
  hA_outer_W_per_K: 4.3446    # refit 2026-07-01 with corrected coil radii (was 1.8788)
  coil_C_scale: 0.2241        # refit 2026-07-01 — effective mass 22.4% of solid-Cu estimate
                               # (was 0.434 with wrong narrow radii; C_solid is now 3.67x bigger)
  hA_iron_W_per_K: 0.244      # iron/core -> local air (fit 2026-07-02, see note above)
  G_iron_cond_W_per_K: 0.06   # inner coil -> iron/core contact conduction (fit 2026-07-02)
  air_node_C_J_per_K: 3000.0     # shared local-air thermal mass (illustrative)
  air_node_hA_far_W_per_K: 40.0  # local air -> far ambient (illustrative, unchanged)
