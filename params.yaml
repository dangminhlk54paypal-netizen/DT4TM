# --- Original benchmark (to validate EM solver; NO iron core, 20A) ---
# Geometry from the actual TeamProblem28.pdf (Karl/Fetzer/Kurz/Lehner/Rucker, Fig.2 +
# text), supplied by the user 2026-06-23 -- NOT the same coil geometry as this rig
# (rig's 1000/500-turn coils are a different, separately-measured device; user
# confirmed "ap dung so do len model thuc" -- don't reconcile the two).
# Fig.2 dims (mm): plate dia 130 (R=65) x 3 thick; coil block height 52; w1 (inner,
# 960t) r=15..28; w2 (outer,576t) r=41..46.5; current i(t)=20A*sin(2*pi*50*t), coils
# in series with OPPOSITE winding sense (matches current_sign convention already
# used for the rig); initial rest gap z=3.8mm (matches plate_material.z_bottom_mm
# default); settles at z=11.3mm after damped oscillation.
# STATUS (2026-06-23): with this geometry (was previously missing -- benchmark used
# to silently fall back to the RIG's coil radii, very wrong), z_eq~=7.1mm vs 11.3mm
# expected (37% error) -- much closer than the old z_eq~=3.4mm (70% error), but not
# matching yet. Ruled out: mesh resolution (converges by fine_step=0.2mm, run_bench
# mark_validation() now uses that just for this benchmark), domain size/coarse_step
# (no sensitivity), current_sign convention (flipping it overshoots by 20-30x, so
# opposite-winding is right). Remaining gap is unexplained -- some other modelling
# detail differs from the paper's BEM-FEM method. See CLAUDE.md.
benchmark_team28_original:
  current_A: 20.0
  inner_turns: 960
  outer_turns: 576
  inner_r_inner_mm: 15.0
  inner_r_outer_mm: 28.0
  outer_r_inner_mm: 41.0
  outer_r_outer_mm: 46.5
  plate_radius_mm: 65.0
  initial_gap_mm: 3.8       # informational: rest position at t<=0 (winding-form thickness)
  expected_levitation_height_mm: 11.3

# REFERENCE-ONLY: no code reads this block directly; lumped_thermal calibration
# constants below were derived by hand against this data, not auto-fit from it.
# --- Real-rig validation data (HIKMICRO IR camera session, 2026-06-23) ---
# Two measured operating points (AC 50Hz). thermal_at_7p8A is the calibration
# anchor for the coil lumped thermal network (see lumped_thermal below) --
# coil readings (dark varnish) are trustworthy; disc/center readings are NOT
# (shiny aluminium, true emissivity ~0.1 vs camera epsilon=0.91 -> reads low).
validation_data:
  source: "AC 50Hz"
  op_points:
    - {V: 190, I: 5.0}
    - {V: 270, I: 7.8}
  thermal_at_7p8A:
    inner_coil_C: 79
    outer_coil_C: 74
    center_core_C: 45
    separator_C: 40
    disc_rim_C: 40
    disc_center_C: 37
    ambient_C: 29
    note: "disc+center IR unreliable (shiny Al, ε set 0.91)"
  # Second session, same day: a two-stage current RAMP (not held at one current
  # long enough to reach steady state) -- used to fit the coil's TRANSIENT time
  # constant (tau), since thermal_at_7p8A above only constrains the steady state.
  # Timestamps are from the narrated timeline (approximate, +-~10s), t=0 at the
  # start of the 0->5A ramp. ambient ranged 28.6-33.7C across the rig (not a single
  # clean value); coil/disc-bottom readings used here, not the unreliable shiny-Al
  # disc/center ones (see note above -- same caveat likely applies to this run's
  # disc+center readings too, not explicitly re-tested with matte paint).
  thermal_ramp_test:
    stage1: {t_s: [0, 300], I_A: 5.0, V: 190}
    stage2: {t_s: [300, 450], I_A: 7.75, V: 270}
    outer_coil_C_vs_t: [{t_s: 140, C: 40}, {t_s: 200, C: 43}, {t_s: 300, C: 48.5},
                         {t_s: 360, C: 55.75}, {t_s: 450, C: 56}]
    at_t450s:
      inner_coil_C: 60.75
      outer_coil_C: 56
      center_core_C: 39.5      # unreliable, see note above
      separator_C: 36
      disc_bottom_rim_C: 44
      disc_bottom_center_C: 35  # unreliable, see note above
    note: "ambient 28.6-33.7C across the rig; used T_amb=29C to match thermal_at_7p8A"

# --- Lumped thermal network: coils/iron -> shared local air node -> far ambient.
# hA_inner/hA_outer RE-CALIBRATED 2026-07-01 after correcting coil geometry.
# Previous calibration (2026-06-23) used WRONG coil radii (inner 28-43mm, outer
# 46.5-61.5mm) -> P_coil(5A)=72.8W. Corrected radii (inner 28-78mm, outer
# 104-124mm) give P_coil(5A)=128.2W (P_inner=61.75W, P_outer=66.41W).
# Same source data: validation_data.thermal_at_7p8A (steady state: inner=79C,
# outer=74C, T_amb=29C) AND validation_data.thermal_ramp_test (transient).
# Steady-state equations (7.8A as amplitude, same convention as before):
#   T_inner = T_amb + P_inner(7.8A)/hA_inner + AIR_DT_SS
#   T_outer = T_amb + P_outer(7.8A)/hA_outer + AIR_DT_SS
#   AIR_DT_SS = P_total(7.8A) / air_node_hA_far = 311.9/40 = 7.80 K
#   -> hA_inner = 150.3/(79-29-7.8) = 3.5611 W/K
#   -> hA_outer = 161.6/(74-29-7.8) = 4.3446 W/K
# Predicted steady state at 5A/T_amb=20C: T_inner=40.5C, T_outer=38.5C (same as
# before -- makes sense: both P and hA scaled proportionally, so T_ss is invariant).
# coil_C_scale refit via weighted least-squares from ramp-test transient (see
# validation_data.thermal_ramp_test): optimized scale=0.2241 (was 0.434 with old
# wrong narrow coils; old C_solid was ~1513 J/K, new correct C_solid=5556 J/K;
# effective C_eff = 0.2241*5556 = 1245 J/K -- physically larger than old 657 J/K,
# as expected for the correct bigger coil). Transient unweighted RMS residual ~3C
# (similar quality to old fit). Treat tau as order-of-magnitude (fit from narrated
# timeline +-~10s uncertainty; a logged repeat run would sharpen it).
# air_node_hA_far_W_per_K kept at 40.0 (not enough independent data to refit).
# --- WP-B (2026-07-02): realistic coil COOLING (rig feedback: "dây vừa nóng cần
# rất lâu để nguội trong không khí"; the plain RC node above cools with the SAME
# tau it heats with, ~350s, unrealistic). Two additions, both scratch-fit against
# thermal_ramp_test (script not committed, see build_twin_html_fem.py romStep):
#   1. Nonlinear natural convection h(dT) = hA_cal * (dT/dT_cal)^convection_exponent
#      (simplified Churchill-Chu, dT_cal = each node's own P_ref/hA at I_ref
#      steady state) -- h stays hA_cal exactly at the I_ref calibration point, but
#      drops off as dT shrinks toward 0 during cooldown -> long cooling tail.
#   2. Two-node coil (surface + winding-core): ALL P_ref lands on the surface
#      node (same as before, so the 0-450s ramp-test transient is essentially
#      unchanged); the winding-core mass ((1-coil_C_scale) of the solid-copper
#      mass, i.e. the 77.6% NOT already counted in coil_C_scale) only exchanges
#      heat with the surface via coil_G_wind_W_per_K -- invisible while heating,
#      but keeps feeding the surface for a long time after the current is cut.
# Refit result (coil_C_scale UNCHANGED at 0.2241; only G_wind is new): ramp-test
# RMS = 2.5°C (better than the ~3°C previously claimed for the single-node model
# -- re-checking that claim found the CURRENTLY deployed single-node model
# actually scores RMS=6.6°C on this exact data, i.e. it had drifted stale, most
# likely after later additions such as the iron contact-conduction node; the new
# two-node model both fixes the drift and adds realistic cooling). Cooldown time
# to reach T_air+10%ΔT is now ~8x longer than the old single-node model (inner
# ~2080s vs ~255s) -- comfortably past the >=3x qualitative target, though there
# is still NO real cooldown IR data (see TODO in CLAUDE.md) to fit the absolute
# tau against, so treat this as order-of-magnitude, same caveat as coil_C_scale.
# Iron/core node (2026-07-02): heated by CONTACT CONDUCTION from the inner coil
# (G_iron_cond), not just via the air pocket -- without it the node stayed ~2K
# above ambient after 30 min while the real core/separator reach 36-45C.
# Anchored on HIKMICRO session 1 (7.8A steady, amb 29C): core 45C (+16K) while
# inner coil +50K -> steady ratio ~0.32; time constant ~4 min. Solving
# tau = C/(G+hA) = 240s with the 0.32 ratio (C = 73 J/K) gives G=0.06, hA=0.244.
# CAVEAT: core IR reading is low-confidence (shiny surface, wrong emissivity) --
# order-of-magnitude fit; refit with contact thermocouples later.
# STALE 2026-07-10: hA_inner/hA_outer/coil_C_scale below were fitted against the
# PRE-remeasurement coil geometry (P_inner/P_outer(7.8A) was 150.3/161.6W). The
# 2026-07-10 coil-radii + iron-material update (see coils:/iron_core:/
# outer_iron_ring: above) gives P_inner/P_outer(7.8A)=127.3/131.7W (~15-18% lower)
# and P_iron/P_plate are no longer ~0 -- these three numbers need refitting against
# validation_data with the new losses (see CLAUDE.md NEXT list). Left UNCHANGED here
# for now (not a quick substitution -- needs the same weighted least-squares refit
# as the original calibration) -- predicted steady-state coil temps are unreliable
# until that happens.
lumped_thermal:
  hA_inner_W_per_K: 3.5611    # refit 2026-07-01 with corrected coil radii (was 2.2479)
  hA_outer_W_per_K: 4.3446    # refit 2026-07-01 with corrected coil radii (was 1.8788)
  coil_C_scale: 0.2241        # refit 2026-07-01 — effective mass 22.4% of solid-Cu estimate
                               # (was 0.434 with wrong narrow radii; C_solid is now 3.67x bigger)
  hA_iron_W_per_K: 0.244      # iron/core -> local air (fit 2026-07-02, see note above)
  G_iron_cond_W_per_K: 0.06   # inner coil -> iron/core contact conduction (fit 2026-07-02)
  air_node_C_J_per_K: 3000.0     # shared local-air thermal mass (illustrative)
  air_node_hA_far_W_per_K: 40.0  # local air -> far ambient (illustrative, unchanged)
  coil_G_wind_W_per_K: 1.0    # NEW WP-B 2026-07-02: coil surface<->winding-core
                               # conductance (both coils share this value); fit
                               # against thermal_ramp_test, see note above.
  convection_exponent: 0.25   # NEW WP-B 2026-07-02: simplified Churchill-Chu
                               # natural-convection exponent, h ~ dT^n, applied to
                               # every coil/iron node (see note above).
  coil_hot_display_C: 80.0    # NEW WP-D 2026-07-02: coil colour-ramp ceiling for the
                               # HTML twin (0=T_amb, 1=this). Anchored to IR session 1's
                               # hottest reading (inner coil 79C@7.8A). Was a JS literal
                               # `T_COIL_HOT`; moved here so it's not hardcoded.
